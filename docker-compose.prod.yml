version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-u", "app.py"]
    env_file:
      - .env.production
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_HOST: "qdrant"
      DB_MODE: "sqlite"
      DATABASE_URL: "sqlite:///app/storage/task_schedular.db"
      PYTHONUNBUFFERED: "1"
    ports:
      - "5000:5000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
    restart: always

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-u", "worker.py"]
    env_file:
      - .env.production
    environment:
      API_URL: "http://backend:5000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "production-worker-1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

volumes:
  backend_storage:
  qdrant_storage:
