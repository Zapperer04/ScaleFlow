name: ScaleFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils sqlite3

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-mock pytest-anyio psutil

    - name: Run Pytest Suite
      run: |
        pytest tests/test_evaluation_engine.py tests/test_streaming.py tests/test_security.py tests/test_cache_manager.py tests/test_observability.py tests/test_health_endpoints.py tests/test_document_management.py tests/test_api_contracts.py tests/test_full_production_pipeline.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Node Dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Build Production Bundle
      run: |
        cd frontend
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
    - uses: actions/checkout@v3

    - name: Build Backend Docker Image
      run: |
        docker build -t scaleflow-backend:latest ./backend

    - name: Build Frontend Docker Image
      run: |
        docker build -t scaleflow-frontend:latest ./frontend
