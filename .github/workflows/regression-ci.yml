name: ScaleFlow Regression CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest black ruff flake8 isort mypy requests sqlalchemy jsonschema
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
    - name: Run Architecture Fitness Tests
      run: python -m pytest -m architecture
    - name: Run Schema Contract Tests
      run: python -m pytest -m contracts
    - name: Run Behavioral Regression Tests
      run: python -m pytest -m regression
    - name: Run E2E Integration Tests
      run: python -m pytest -m integration
