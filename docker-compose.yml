version: '3.8'

services:
  worker1:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    environment:
      API_URL: "http://host.docker.internal:5000"
      REDIS_HOST: "redis"
      WORKER_ID: "worker-1"
      API_KEY: "${API_KEY:-dev_secret_api_key}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker2:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    environment:
      API_URL: "http://host.docker.internal:5000"
      REDIS_HOST: "redis"
      WORKER_ID: "worker-2"
      API_KEY: "${API_KEY:-dev_secret_api_key}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker3:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    environment:
      API_URL: "http://host.docker.internal:5000"
      REDIS_HOST: "redis"
      WORKER_ID: "worker-3"
      API_KEY: "${API_KEY:-dev_secret_api_key}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"