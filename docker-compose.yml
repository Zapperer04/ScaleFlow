version: '3.8'

services:
  backend:
    build: ./backend
    command: ["python", "-u", "app.py"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_HOST: "qdrant"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/task_schedular"
      DB_MODE: "postgres"
      TASK_RUNNING_TIMEOUT_SECONDS: "5400"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HUGGINGFACE_HUB_VERBOSITY: "error"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BACKPRESSURE_ENABLED: "False"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/task-types')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker1:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    env_file:
      - ./backend/.env
    environment:
      API_URL: "http://backend:5000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "worker-1"
      PYTHONUNBUFFERED: "1"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.05}"
      MIN_DICTIONARY_WORD_RATIO: "${MIN_DICTIONARY_WORD_RATIO:-0.20}"
      WORKER_CAPABILITIES: "default,cpu_heavy,embedding_gpu,summarization_llm,retrieval_optimized,io_heavy"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HUGGINGFACE_HUB_VERBOSITY: "error"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BACKPRESSURE_ENABLED: "False"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker2:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    env_file:
      - ./backend/.env
    environment:
      API_URL: "http://backend:5000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "worker-2"
      PYTHONUNBUFFERED: "1"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.05}"
      MIN_DICTIONARY_WORD_RATIO: "${MIN_DICTIONARY_WORD_RATIO:-0.20}"
      WORKER_CAPABILITIES: "default,cpu_heavy,embedding_gpu,summarization_llm,retrieval_optimized,io_heavy"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HUGGINGFACE_HUB_VERBOSITY: "error"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BACKPRESSURE_ENABLED: "False"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker3:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    env_file:
      - ./backend/.env
    environment:
      API_URL: "http://backend:5000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "worker-3"
      PYTHONUNBUFFERED: "1"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.05}"
      MIN_DICTIONARY_WORD_RATIO: "${MIN_DICTIONARY_WORD_RATIO:-0.20}"
      WORKER_CAPABILITIES: "default,cpu_heavy,embedding_gpu,summarization_llm,retrieval_optimized,io_heavy"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HUGGINGFACE_HUB_VERBOSITY: "error"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      BACKPRESSURE_ENABLED: "False"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_schedular
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: