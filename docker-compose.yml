version: '3.8'

services:
  worker1:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    environment:
      API_URL: "http://host.docker.internal:5000"
      REDIS_HOST: "redis"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "worker-1"
      API_KEY: "${API_KEY:-dev_secret_api_key}"
      PYTHONUNBUFFERED: "1"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.3}"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker2:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    environment:
      API_URL: "http://host.docker.internal:5000"
      REDIS_HOST: "redis"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "worker-2"
      API_KEY: "${API_KEY:-dev_secret_api_key}"
      PYTHONUNBUFFERED: "1"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.3}"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker3:
    build: ./backend
    command: ["python", "-u", "worker.py"]
    environment:
      API_URL: "http://host.docker.internal:5000"
      REDIS_HOST: "redis"
      QDRANT_HOST: "qdrant"
      WORKER_ID: "worker-3"
      API_KEY: "${API_KEY:-dev_secret_api_key}"
      PYTHONUNBUFFERED: "1"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.3}"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_schedular
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: