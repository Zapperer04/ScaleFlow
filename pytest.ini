[pytest]
testpaths = tests/regression tests/architecture tests/contracts tests/providers tests/repositories tests/storage tests/cache tests/vector tests/checkpoints tests/compatibility tests/persistence_migration
pythonpath = backend .
markers =
    regression: Core regression behavioral tests
    parser: Parser behavioral regression tests
    retrieval: Retrieval query & rank regression tests
    worker: Worker lifecycle, queue, and lease regression tests
    integration: End-to-end integration and API tests
    architecture: Codebase architectural fitness and boundaries tests
    contracts: API and schema contract validation tests
    determinism: Deterministic execution verification tests
    snapshot: Artifact comparison and snapshot tests
    slow: Tests that take longer to run
    offline: Tests designed to run without active external services
    golden: Tests verifying against the Golden Dataset
